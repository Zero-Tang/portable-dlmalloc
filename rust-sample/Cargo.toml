[package]
name = "rust-sample"
version = "0.1.0"
edition = "2021"

[dependencies]
static-collections = "0.2.0"

[dependencies.portable-dlmalloc]
path = ".."
features = ["alt-alloc"]

[target.'cfg(windows)'.dependencies.windows]
version="0.62.2"
features=["Win32_System_Memory","Win32_System_Threading","Win32_System_Console"]

[target.'cfg(unix)'.dependencies.libc]
version = "0.2.177"
